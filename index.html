<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱 數學試卷 Turnitin 查重系統 (完整預覽修復版)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSZip for Deep DOCX -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- PDF.js for Pure Client-side PDF Rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    <style>
        body { background-color: #f0f8ff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .cat-shadow { box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.1), 0 2px 4px -1px rgba(59, 130, 246, 0.06); }
        .paw-print { background-image: radial-gradient(circle, #bfdbfe 20%, transparent 20%); background-size: 20px 20px; }
        
        .doc-viewer::-webkit-scrollbar, .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .doc-viewer::-webkit-scrollbar-track, .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
        .doc-viewer::-webkit-scrollbar-thumb, .custom-scrollbar::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 8px; }
        
        mark { transition: background-color 0.2s ease; border-radius: 2px; }
        mark.match-exact { background-color: #fca5a5; color: #7f1d1d; cursor: pointer; }
        mark.match-exact:hover { background-color: #ef4444; color: white; }
        mark.match-high { background-color: #fde047; color: #854d0e; cursor: pointer; }
        mark.match-high:hover { background-color: #eab308; color: white; }
    </style>
</head>
<body class="paw-print min-h-screen p-4 md:p-8 text-slate-800 relative">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="bg-blue-600 text-white rounded-t-2xl p-6 text-center cat-shadow relative overflow-hidden">
            <h1 class="text-3xl font-bold mb-2">🐾 數學科 Turnitin 級查重系統</h1>
            <p class="text-blue-100">支援 PDF 畫布渲染與 DOCX 全文高亮追蹤</p>
            <div class="absolute -top-4 -right-4 text-7xl opacity-20">🐱</div>
        </header>

        <!-- Main Content -->
        <main class="bg-white rounded-b-2xl p-6 md:p-8 cat-shadow mb-8 border-t-4 border-blue-300">
            <div id="settingsPanel" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="bg-blue-50 p-5 rounded-xl border border-blue-100">
                    <h2 class="text-lg font-bold text-blue-800 mb-4">🐈 試卷設定</h2>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-sm font-medium text-blue-700 mb-1">年級 (Form)</label>
                            <select id="formSelect" class="w-full rounded-lg border-blue-200 p-2 focus:ring-blue-500 outline-none">
                                <option value="S1">S1</option><option value="S2">S2</option><option value="S3">S3</option>
                                <option value="S4">S4</option><option value="S5">S5</option><option value="S6" selected>S6</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-blue-700 mb-1">卷別 (Module/Paper)</label>
                            <select id="moduleSelect" class="w-full rounded-lg border-blue-200 p-2 focus:ring-blue-500 outline-none">
                                <option value="Compulsory_P1">Compulsory Part (Paper 1)</option>
                                <option value="Compulsory_P2">Compulsory Part (Paper 2)</option>
                                <option value="M1">Extended Module 1 (M1)</option>
                                <option value="M2">Extended Module 2 (M2)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-blue-700 mb-1">GitHub 儲存庫</label>
                            <input type="text" id="repoInput" value="jszm117/papercheck" class="w-full rounded-lg border-gray-300 p-2 outline-none border bg-white">
                        </div>
                    </div>
                </div>

                <div class="bg-blue-50 p-5 rounded-xl border border-blue-100 flex flex-col justify-between">
                    <div>
                        <h2 class="text-lg font-bold text-blue-800 mb-4">📥 上傳新試卷</h2>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-blue-700 mb-1">上傳需要檢查的試卷 (.docx / .pdf)</label>
                            <input type="file" id="newPaperUpload" accept=".docx,.pdf" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200">
                        </div>
                    </div>
                    <button onclick="startAnalysis()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition duration-200 shadow-md flex justify-center items-center gap-2 text-lg">
                        <span>開始 Turnitin 掃描</span> 🔍
                    </button>
                </div>
            </div>

            <!-- Loading State -->
            <div id="loadingState" class="hidden text-center py-12">
                <div class="inline-block animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-600 mb-4"></div>
                <p class="text-xl text-blue-800 font-bold" id="loadingText">正在進行深度文件掃描... 🐱</p>
                <p class="text-sm text-blue-500 mt-2">（系統正在建立文字層與座標索引）</p>
            </div>

            <!-- Document Viewer -->
            <div id="documentViewerContainer" class="hidden">
                <div class="flex justify-between items-center border-b-2 border-blue-200 pb-3 mb-4">
                    <h2 class="text-2xl font-bold text-slate-800">📄 查重報告 (Visual Report)</h2>
                    <button onclick="location.reload()" class="text-sm bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-lg font-medium transition">
                        🔄 重新檢查另一份
                    </button>
                </div>
                
                <div class="flex gap-4 mb-4">
                    <span class="px-3 py-1 bg-red-100 text-red-800 rounded-full text-sm font-bold border border-red-300">🔴 完全重複: <span id="statExact">0</span> 行</span>
                    <span class="px-3 py-1 bg-yellow-100 text-yellow-800 rounded-full text-sm font-bold border border-yellow-300">🟡 高度相似: <span id="statHigh">0</span> 行</span>
                </div>

                <p class="text-sm text-slate-500 mb-4">💡 提示：<strong class="text-blue-600">點擊</strong>高亮文字，系統會自動跳轉至對應題目頁面並標記黃色高亮！</p>

                <div class="bg-gray-50 border-2 border-gray-200 rounded-lg p-8 shadow-inner max-h-[700px] overflow-y-auto doc-viewer text-lg leading-relaxed font-serif" id="docRenderArea">
                </div>
            </div>
        </main>
    </div>

    <!-- 內嵌預覽的懸浮視窗 -->
    <div id="matchTooltip" class="hidden absolute z-50 bg-white border-2 border-blue-400 shadow-2xl rounded-xl p-4 w-[550px] pointer-events-auto transition-opacity duration-200 opacity-0 transform -translate-y-2">
        <div class="flex justify-between items-center border-b border-gray-200 pb-2 mb-2">
            <div class="overflow-hidden">
                <span class="text-xs font-bold text-blue-600 uppercase tracking-wider">📁 來源檔案 (Source Paper)</span>
                <div id="ttSource" class="text-sm font-bold text-slate-800 mt-1 truncate">...</div>
            </div>
            <div id="ttScore" class="text-xs font-bold text-white px-2 py-1 rounded whitespace-nowrap ml-2 flex-shrink-0">...</div>
        </div>
        
        <div>
            <span class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 block">👀 原始檔案預覽 (Preview)</span>
            
            <div id="ttViewerContainer" class="bg-slate-200 border border-slate-300 rounded overflow-y-auto custom-scrollbar overflow-x-hidden h-80 relative flex flex-col items-center scroll-smooth">
                
                <div id="ttLoading" class="absolute inset-0 flex flex-col items-center justify-center text-slate-600 text-sm font-bold bg-slate-100/90 z-20 backdrop-blur-sm">
                    <div class="animate-spin rounded-full h-8 w-8 border-t-4 border-b-4 border-blue-600 mb-2"></div>
                    正在繪製頁面與座標...
                </div>

                <!-- PDF 專用畫布 -->
                <canvas id="ttCanvas" class="relative z-10 bg-white shadow-md my-2"></canvas>
                <!-- DOCX 專用純文字框 -->
                <div id="ttFallbackText" class="hidden p-6 text-sm text-slate-700 whitespace-pre-wrap font-serif w-full bg-white text-left leading-relaxed min-h-full relative z-10"></div>
            </div>
        </div>
    </div>

    <script>
        let matchDatabase = {};
        let pdfDocumentCache = {}; 
        let docxTextCache = {}; // 新增：用來暫存 DOCX 的完整全文
        let currentRenderTask = null;
        const tooltip = document.getElementById('matchTooltip');

        async function extractTextFromFile(file) {
            if (file.name.endsWith('.docx')) {
                const zip = await JSZip.loadAsync(file);
                const docXml = await zip.file("word/document.xml").async("string");
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(docXml, "text/xml");
                const paragraphs = xmlDoc.getElementsByTagName("w:p");
                
                let fullText = '';
                for (let i = 0; i < paragraphs.length; i++) {
                    let pText = "";
                    const nodes = paragraphs[i].getElementsByTagName("*");
                    for (let j = 0; j < nodes.length; j++) {
                        if (nodes[j].nodeName === "w:t" || nodes[j].nodeName === "m:t") {
                            pText += nodes[j].textContent;
                        }
                    }
                    if (pText.trim() !== '') fullText += pText + "\n";
                }
                return fullText;
                
            } else if (file.name.endsWith('.pdf')) {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
                let fullText = '';
                
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    let lastY = -1;
                    for (let item of textContent.items) {
                        const y = item.transform[5];
                        if (lastY !== -1 && Math.abs(y - lastY) > 5) fullText += '\n';
                        fullText += item.str;
                        lastY = y;
                    }
                    fullText += '\n\n';
                }
                return fullText;
            }
            return '';
        }

        function splitIntoChunks(text) {
            return text.split('\n').map(c => c.trim()).filter(c => c.length > 5);
        }

        async function fetchPastPapersFromGitHub(repo, form, moduleName) {
            if (!repo) return [];
            const years = [2026, 2025, 2024, 2023, 2022, 2021, 2020];
            const terms = ['Term1', 'Final'];
            const exts = ['.pdf', '.docx'];
            let fetchedTexts = [];

            for (const year of years) {
                for (const term of terms) {
                    for (const ext of exts) {
                        const path = `papers/${form}/${moduleName}_${year}_${term}${ext}`;
                        const url = `https://raw.githubusercontent.com/${repo}/main/${path}`;
                        try {
                            const response = await fetch(url);
                            if (response.ok) {
                                if (ext === '.pdf') {
                                    const arrayBuffer = await response.arrayBuffer();
                                    const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
                                    pdfDocumentCache[url] = pdf; 
                                    
                                    let pages = [];
                                    for (let i = 1; i <= pdf.numPages; i++) {
                                        const page = await pdf.getPage(i);
                                        const textContent = await page.getTextContent();
                                        let fullText = '';
                                        let lastY = -1;
                                        for (let item of textContent.items) {
                                            const y = item.transform[5];
                                            if (lastY !== -1 && Math.abs(y - lastY) > 5) fullText += '\n';
                                            fullText += item.str;
                                            lastY = y;
                                        }
                                        pages.push({ pageNum: i, text: fullText });
                                    }
                                    fetchedTexts.push({ source: path, url: url, type: 'pdf', pages: pages });
                                } else {
                                    const blob = await response.blob();
                                    const file = new File([blob], path);
                                    const text = await extractTextFromFile(file);
                                    
                                    // 儲存 DOCX 完整文字到快取中
                                    docxTextCache[url] = text; 
                                    fetchedTexts.push({ source: path, url: url, type: 'docx', pages: [{pageNum: 1, text: text}] });
                                }
                                break; 
                            }
                        } catch (e) {}
                    }
                }
            }
            return fetchedTexts;
        }

        function calculateSimilarity(str1, str2) {
            const clean1 = str1.replace(/\s+/g, '').toLowerCase();
            const clean2 = str2.replace(/\s+/g, '').toLowerCase();
            if (clean1 === clean2) return 1.0;
            if (clean1.length < 2 || clean2.length < 2) return 0;
            
            let bigrams1 = new Map();
            for (let i = 0; i < clean1.length - 1; i++) {
                const bg = clean1.substring(i, i+2);
                bigrams1.set(bg, (bigrams1.get(bg) || 0) + 1);
            }
            
            let intersection = 0;
            for (let i = 0; i < clean2.length - 1; i++) {
                const bg = clean2.substring(i, i+2);
                if (bigrams1.has(bg) && bigrams1.get(bg) > 0) {
                    bigrams1.set(bg, bigrams1.get(bg) - 1);
                    intersection++;
                }
            }
            return (2.0 * intersection) / (clean1.length - 1 + clean2.length - 1);
        }

        function showTooltip(event, matchId) {
            const data = matchDatabase[matchId];
            if (!data) return;

            document.getElementById('ttSource').innerText = data.type === 'pdf' ? `${data.source} (第 ${data.pageNum} 頁)` : data.source;
            
            const scoreEl = document.getElementById('ttScore');
            scoreEl.innerText = `相似度: ${data.percentage}%`;
            scoreEl.className = data.percentage === 100 
                ? "text-xs font-bold text-white px-2 py-1 rounded bg-red-600 ml-2 flex-shrink-0" 
                : "text-xs font-bold text-white px-2 py-1 rounded bg-yellow-600 ml-2 flex-shrink-0";

            const canvas = document.getElementById('ttCanvas');
            const fallbackText = document.getElementById('ttFallbackText');
            const loading = document.getElementById('ttLoading');
            const viewerContainer = document.getElementById('ttViewerContainer');

            loading.classList.remove('hidden');
            viewerContainer.scrollTop = 0; 

            if (currentRenderTask) {
                currentRenderTask.cancel();
                currentRenderTask = null;
            }

            if (data.type === 'pdf') {
                fallbackText.classList.add('hidden');
                canvas.classList.remove('hidden');

                const pdfDoc = pdfDocumentCache[data.url];
                if (pdfDoc) {
                    pdfDoc.getPage(data.pageNum).then(page => {
                        const unscaledViewport = page.getViewport({ scale: 1.0 });
                        const scale = 510 / unscaledViewport.width;
                        const viewport = page.getViewport({ scale: scale });

                        const ctx = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        ctx.clearRect(0, 0, canvas.width, canvas.height); 

                        const renderContext = { canvasContext: ctx, viewport: viewport };
                        currentRenderTask = page.render(renderContext);
                        
                        currentRenderTask.promise.then(() => {
                            page.getTextContent().then(textContent => {
                                let foundY = -1;
                                const searchStr = data.text.replace(/\s+/g, '').toLowerCase();
                                
                                textContent.items.forEach(item => {
                                    const itemStr = item.str.replace(/\s+/g, '').toLowerCase();
                                    if (itemStr.length > 2 && searchStr.includes(itemStr)) {
                                        const pt = viewport.convertToViewportPoint(item.transform[4], item.transform[5]);
                                        const height = Math.abs(item.transform[3] * viewport.scale) || 14; 
                                        const width = (item.width * viewport.scale) || 50;
                                        
                                        ctx.fillStyle = 'rgba(253, 224, 71, 0.45)';
                                        ctx.fillRect(pt[0], pt[1] - height, width, height * 1.3);
                                        
                                        if (foundY === -1 || pt[1] < foundY) foundY = pt[1] - height;
                                    }
                                });

                                if (foundY !== -1) {
                                    viewerContainer.scrollTo({ top: Math.max(0, foundY - 40), behavior: 'smooth' });
                                }
                                loading.classList.add('hidden');
                            });
                        }).catch(err => {
                            if (err.name !== 'RenderingCancelledException') loading.classList.add('hidden');
                        });
                    });
                }
            } else {
                // DOCX 處理邏輯
                canvas.classList.add('hidden');
                fallbackText.classList.remove('hidden');
                
                // 取得剛才快取的完整 DOCX 全文
                const fullText = docxTextCache[data.url] || data.text;
                
                // 跳脫字元，防止渲染出錯
                const escapeHTML = str => str.replace(/[&<>'"]/g, tag => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
                }[tag]));
                
                let htmlContent = escapeHTML(fullText);
                const matchStr = escapeHTML(data.text);
                
                // 替換相符的文字，加入醒目的黃色高亮標籤
                if (matchStr && htmlContent.includes(matchStr)) {
                    htmlContent = htmlContent.replace(matchStr, `<mark id="docx-highlight" class="bg-yellow-300 text-black px-1 rounded shadow-sm">${matchStr}</mark>`);
                }
                
                fallbackText.innerHTML = htmlContent || '（Word 檔案無法讀取內容）';
                loading.classList.add('hidden');

                // 延遲一下讓瀏覽器畫出文字，然後自動捲動到黃色高亮的地方
                setTimeout(() => {
                    const mark = document.getElementById('docx-highlight');
                    if (mark) {
                        mark.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
            }

            const x = Math.min(event.pageX + 15, window.innerWidth - 570);
            let y = event.pageY + 15;
            if (y + 400 > window.innerHeight + window.scrollY) {
                y = event.pageY - 420; 
            }

            tooltip.style.left = `${x}px`;
            tooltip.style.top = `${y}px`;
            tooltip.classList.remove('hidden');
            
            setTimeout(() => {
                tooltip.classList.remove('opacity-0', '-translate-y-2');
                tooltip.classList.add('opacity-100', 'translate-y-0');
            }, 10);
        }

        function hideTooltip() {
            tooltip.classList.remove('opacity-100', 'translate-y-0');
            tooltip.classList.add('opacity-0', '-translate-y-2');
            setTimeout(() => { tooltip.classList.add('hidden'); }, 200);
        }

        document.addEventListener('mousedown', function(event) {
            if (!tooltip.contains(event.target) && !event.target.closest('mark')) {
                hideTooltip();
            }
        });

        async function startAnalysis() {
            const newFileInput = document.getElementById('newPaperUpload').files[0];
            if (!newFileInput) {
                alert('請先上傳一份新試卷！');
                return;
            }

            document.getElementById('settingsPanel').classList.add('hidden');
            document.getElementById('loadingState').classList.remove('hidden');

            try {
                const newText = await extractTextFromFile(newFileInput);
                const originalLines = newText.split('\n'); 
                
                const repo = document.getElementById('repoInput').value.trim();
                const form = document.getElementById('formSelect').value;
                const mod = document.getElementById('moduleSelect').value;
                
                const pastPapers = await fetchPastPapersFromGitHub(repo, form, mod);
                
                if (pastPapers.length === 0) {
                    alert('注意：未能從 GitHub 找到任何歷史試卷，請確認儲存庫結構正確。');
                }

                let allPastChunks = [];
                pastPapers.forEach(paper => {
                    paper.pages.forEach(pageData => {
                        const chunks = splitIntoChunks(pageData.text);
                        chunks.forEach(c => allPastChunks.push({
                            source: paper.source,
                            url: paper.url,
                            type: paper.type,
                            pageNum: pageData.pageNum,
                            text: c
                        }));
                    });
                });

                document.getElementById('loadingText').innerText = '正在比對並生成視覺報告... 🔢';

                let exactCount = 0;
                let highCount = 0;
                let htmlOutput = '';
                matchDatabase = {}; 

                for (let i = 0; i < originalLines.length; i++) {
                    const line = originalLines[i];
                    const trimmedLine = line.trim();
                    
                    if (trimmedLine.length < 5) {
                        htmlOutput += `<div>${line || '&nbsp;'}</div>`;
                        continue;
                    }

                    let bestMatch = { score: 0, text: '', source: '', url: '', type: '', pageNum: 1 };
                    allPastChunks.forEach(past => {
                        const score = calculateSimilarity(trimmedLine, past.text);
                        if (score > bestMatch.score) {
                            bestMatch = { 
                                score: score, 
                                text: past.text, 
                                source: past.source, 
                                url: past.url, 
                                type: past.type, 
                                pageNum: past.pageNum 
                            };
                        }
                    });

                    const percentage = Math.round(bestMatch.score * 100);
                    const matchId = 'match_' + i;

                    if (percentage === 100) {
                        exactCount++;
                        matchDatabase[matchId] = { percentage, ...bestMatch };
                        htmlOutput += `<div class="my-1"><mark class="match-exact" onclick="showTooltip(event, '${matchId}')">${line}</mark></div>`;
                    } else if (percentage >= 70) {
                        highCount++;
                        matchDatabase[matchId] = { percentage, ...bestMatch };
                        htmlOutput += `<div class="my-1"><mark class="match-high" onclick="showTooltip(event, '${matchId}')">${line}</mark></div>`;
                    } else {
                        htmlOutput += `<div>${line}</div>`;
                    }
                }

                document.getElementById('statExact').innerText = exactCount;
                document.getElementById('statHigh').innerText = highCount;
                document.getElementById('docRenderArea').innerHTML = htmlOutput;

                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('documentViewerContainer').classList.remove('hidden');

            } catch (error) {
                console.error(error);
                alert('處理發生錯誤: ' + error.message);
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('settingsPanel').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
